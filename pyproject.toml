[project]
name = "smartdischarge"
version = "1.0.0"
description = "30-day readmission risk scoring on the UCI Diabetes 130-US Hospitals data"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.6", "xgboost>=2.0", "shap>=0.45",
  "matplotlib>=3.7", "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
